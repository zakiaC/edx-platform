scenarios:
  - id: BANK_RELEVE_JAN
    sender_type: BANK
    entity_display_name: "Banque Populaire"
    from_email: "banque.populaire@simulation.test"
    reply_to: "service-client@simulation.test"
    subject_template: "Releve de compte {date} - Ref {ref}"
    body_template: |
      Bonjour,
      Veuillez trouver ci-joint votre relevé de compte du {date}.
      Reference dossier: {ref}
      Cordialement,
      Banque Populaire
    attachments:
      - type: pdf
        filename: "releve_compte.pdf"
        size_kb: 120
    tags: ["releve", "mensuel", "compte"]

  - id: TAX_AVIS_IMPOSITION
    sender_type: TAX
    entity_display_name: "Direction Generale des Finances Publiques"
    from_email: "dgfip@simulation.test"
    reply_to: "contact-impots@simulation.test"
    subject_template: "Avis d'imposition {date} - Ref {ref}"
    body_template: |
      Madame, Monsieur,
      Votre avis d'imposition est disponible. Reference: {ref}.
      Merci de consulter le document joint.
      DGFIP
    attachments:
      - type: pdf
        filename: "avis_imposition.pdf"
        size_kb: 140
    tags: ["impots", "avis"]

  - id: SUPPLIER_FACTURE_MAT
    sender_type: SUPPLIER
    entity_display_name: "Fournitures Pro"
    from_email: "facturation@simulation.test"
    reply_to: "compta@simulation.test"
    subject_template: "Facture materiel {date} - Ref {ref}"
    body_template: |
      Bonjour,
      Veuillez trouver la facture relative a vos achats de materiel.
      Montant: {amount} EUR
      Ref: {ref}
      Fournitures Pro
    attachments:
      - type: pdf
        filename: "facture_materiel.pdf"
        size_kb: 95
      - type: csv
        filename: "ligne_facture.csv"
        size_kb: 15
    tags: ["facture", "fournisseur"]

