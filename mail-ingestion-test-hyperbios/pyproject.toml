[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mail-ingestion-test-hyperbios"
version = "0.1.0"
description = "Outil d'envoi d'emails de test pour ingestion Microsoft 365"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hyperbios", email = "dev@hyperbios.test" }]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "typer>=0.12.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "reportlab>=4.1.0",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
ingestion-tester = "ingestion_tester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_tester"]

[tool.pytest.ini_options]
addopts = "-q"
