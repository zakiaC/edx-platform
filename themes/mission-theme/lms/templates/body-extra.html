<%page expression_filter="h"/>
% if getattr(user, 'is_authenticated', False) and getattr(user, 'is_staff', False) and request and not request.path.startswith('/dashboard'):
  <a class="mf-back-formateur" href="/dashboard" aria-label="Mon dashboard">Mon dashboard</a>
  <style>
    .mf-back-formateur {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1200;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, #0f7dca 0%, #0a57b2 45%, #0a2f8f 100%);
      color: #ffffff !important;
      font-family: "Ubuntu", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-decoration: none !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 10px 24px rgba(2, 19, 58, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .mf-back-formateur:hover,
    .mf-back-formateur:focus {
      color: #ffffff !important;
      text-decoration: none !important;
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 14px 26px rgba(2, 19, 58, 0.45);
    }

    .mf-back-formateur:focus {
      outline: 2px solid rgba(1, 232, 174, 0.55);
      outline-offset: 2px;
    }

    @media (max-width: 720px) {
      .mf-back-formateur {
        right: 12px;
        bottom: 12px;
        min-height: 38px;
        padding: 0 12px;
        font-size: 12px;
      }
    }
  </style>
% endif
