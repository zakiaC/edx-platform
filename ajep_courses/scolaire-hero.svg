<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0965D0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0965D0"/>
      <stop offset="100%" style="stop-color:#01E8AE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.08" fill="white">
    <circle cx="50" cy="50" r="2"/><circle cx="90" cy="50" r="2"/><circle cx="130" cy="50" r="2"/><circle cx="170" cy="50" r="2"/>
    <circle cx="50" cy="90" r="2"/><circle cx="90" cy="90" r="2"/><circle cx="130" cy="90" r="2"/><circle cx="170" cy="90" r="2"/>
    <circle cx="50" cy="130" r="2"/><circle cx="90" cy="130" r="2"/><circle cx="130" cy="130" r="2"/><circle cx="170" cy="130" r="2"/>
    <circle cx="1030" cy="270" r="2"/><circle cx="1070" cy="270" r="2"/><circle cx="1110" cy="270" r="2"/><circle cx="1150" cy="270" r="2"/>
    <circle cx="1030" cy="310" r="2"/><circle cx="1070" cy="310" r="2"/><circle cx="1110" cy="310" r="2"/><circle cx="1150" cy="310" r="2"/>
    <circle cx="1030" cy="350" r="2"/><circle cx="1070" cy="350" r="2"/><circle cx="1110" cy="350" r="2"/><circle cx="1150" cy="350" r="2"/>
  </g>

  <!-- Book icon -->
  <g transform="translate(120, 120)">
    <rect x="0" y="20" width="120" height="160" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="10" y="30" width="100" height="140" rx="4" fill="#0a1628" opacity="0.3"/>
    <line x1="60" y1="30" x2="60" y2="170" stroke="white" stroke-width="1" opacity="0.3"/>
    <rect x="25" y="60" width="70" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="25" y="75" width="50" height="4" rx="2" fill="white" opacity="0.4"/>
    <rect x="25" y="90" width="60" height="4" rx="2" fill="white" opacity="0.4"/>
    <rect x="25" y="115" width="70" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="25" y="130" width="40" height="4" rx="2" fill="white" opacity="0.4"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(300, 100)">
    <polygon points="60,0 120,30 60,60 0,30" fill="url(#accent)" opacity="0.9"/>
    <rect x="55" y="30" width="10" height="50" fill="white" opacity="0.5"/>
    <circle cx="60" cy="85" r="8" fill="#01E8AE" opacity="0.8"/>
    <line x1="120" y1="30" x2="120" y2="70" stroke="white" stroke-width="2" opacity="0.5"/>
    <circle cx="120" cy="75" r="5" fill="#01E8AE" opacity="0.6"/>
  </g>

  <!-- Calculator -->
  <g transform="translate(160, 280)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="white" opacity="0.1"/>
    <rect x="10" y="10" width="60" height="20" rx="4" fill="#01E8AE" opacity="0.4"/>
    <circle cx="25" cy="50" r="6" fill="white" opacity="0.2"/>
    <circle cx="45" cy="50" r="6" fill="white" opacity="0.2"/>
    <circle cx="65" cy="50" r="6" fill="white" opacity="0.2"/>
    <circle cx="25" cy="70" r="6" fill="white" opacity="0.2"/>
    <circle cx="45" cy="70" r="6" fill="white" opacity="0.2"/>
    <circle cx="65" cy="70" r="6" fill="white" opacity="0.2"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(380, 200) rotate(-30)">
    <rect x="0" y="0" width="12" height="100" rx="2" fill="#01E8AE" opacity="0.6"/>
    <polygon points="0,100 12,100 6,120" fill="white" opacity="0.4"/>
    <rect x="0" y="0" width="12" height="15" rx="2" fill="white" opacity="0.2"/>
  </g>

  <!-- Main text area -->
  <g transform="translate(500, 100)">
    <text x="0" y="60" font-family="Ubuntu, Arial, sans-serif" font-size="52" font-weight="700" fill="white" letter-spacing="1">
      Soutien Scolaire
    </text>
    <text x="0" y="110" font-family="Ubuntu, Arial, sans-serif" font-size="24" fill="white" opacity="0.7">
      Du CM2 à la Terminale
    </text>

    <!-- Subject badges -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="160" height="40" rx="20" fill="url(#accent)" opacity="0.9"/>
      <text x="80" y="26" font-family="Ubuntu, Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">
        Mathématiques
      </text>

      <rect x="175" y="0" width="120" height="40" rx="20" fill="white" opacity="0.15"/>
      <text x="235" y="26" font-family="Ubuntu, Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">
        Français
      </text>

      <rect x="310" y="0" width="120" height="40" rx="20" fill="white" opacity="0.15"/>
      <text x="370" y="26" font-family="Ubuntu, Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">
        Anglais
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="230" font-family="Ubuntu, Arial, sans-serif" font-size="15" fill="#01E8AE" opacity="0.9">
      Académie AJEP — Avenir · Jeunesse · Entraide · Partage
    </text>
  </g>

  <!-- Accent line bottom -->
  <rect x="0" y="390" width="1200" height="10" fill="url(#accent)"/>
</svg>
