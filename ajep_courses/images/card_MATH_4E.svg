<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0965D0"/>
      <stop offset="100%" style="stop-color:#01E8AE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g opacity="0.1" fill="white">
    <circle cx="20" cy="20" r="1.5"/><circle cx="40" cy="20" r="1.5"/><circle cx="60" cy="20" r="1.5"/>
    <circle cx="20" cy="40" r="1.5"/><circle cx="40" cy="40" r="1.5"/><circle cx="60" cy="40" r="1.5"/>
    <circle cx="340" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/><circle cx="380" cy="240" r="1.5"/>
    <circle cx="340" cy="260" r="1.5"/><circle cx="360" cy="260" r="1.5"/><circle cx="380" cy="260" r="1.5"/>
  </g>

  <!-- Icon -->
  <g transform="translate(30, 80)">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" transform="scale(2.5)"/>
  </g>

  <!-- Cycle badge -->
  <rect x="200" y="30" width="170" height="28" rx="14" fill="white" opacity="0.15"/>
  <text x="285" y="50" font-family="Ubuntu,Arial,sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">College</text>

  <!-- Level -->
  <text x="195" y="135" font-family="Ubuntu,Arial,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="start" letter-spacing="-1">4eme</text>

  <!-- Subject -->
  <text x="195" y="168" font-family="Ubuntu,Arial,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="start" opacity="0.8">Mathematiques</text>

  <!-- Bottom bar -->
  <rect x="0" y="270" width="400" height="10" fill="white" opacity="0.15"/>

  <!-- AJEP tag -->
  <text x="200" y="250" font-family="Ubuntu,Arial,sans-serif" font-size="11" fill="white" text-anchor="start" opacity="0.5" letter-spacing="1.5">ACADEMIE AJEP</text>
</svg>