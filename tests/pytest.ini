[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Tests rapides sans reseau ni Docker (< 5s)
    integration: Tests avec services Docker actifs (< 60s)
    smoke: Tests post-deploiement sur URL live (< 30s)

addopts =
    -v
    --tb=short
    --strict-markers
